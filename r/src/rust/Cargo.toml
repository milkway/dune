[package]
name = "spice"
description = "R bindings (savvy) of the Dune simulator for the `spice` R package"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
publish = false

# Detached from the repository workspace: R CMD build/check copy this
# crate on its own, and the root workspace must not pick it up.
[workspace]

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
savvy = "0.11"
num-complex = "0.4"
# The engine. Relative to src/rust inside the dune repository; the
# package's `configure` rewrites these paths away from it (to the
# vendored copy tools/r-vendor.sh archives, or to DUNE_ROOT).
# `parallel`: `spice_sweep(.threads =)` (issue #10).
dune-core = { path = "../../../crates/dune-core", features = ["parallel"] }
dune-netlist = { path = "../../../crates/dune-netlist" }
dune-raw = { path = "../../../crates/dune-raw" }
# The figure path (`spice_pic()`, issue #21): only dune-pic's public
# API, as the CLI uses it.
dune-pic = { path = "../../../crates/dune-pic" }
# rpic's `texlabels` math renderer (RaTeX, `rpic-render`'s `math`
# feature only), registered before `spice_pic_svg()` renders, so a
# `$...$` label of a `texlabels = 1` figure comes out typeset as in
# `dune pic --svg`. The `rpic-core` pin must equal dune-pic's: the
# renderer hook is a static of that crate, and a second rpic-core in
# the graph would carry its own, unread, hook.
rpic-core = { version = "=0.19.1", optional = true }
rpic-render = { version = "=0.19.1", default-features = false, features = ["math"], optional = true }

[features]
default = ["texlabels"]
# Typeset `$...$` figure labels (rpic `texlabels`) with RaTeX.
texlabels = ["dep:rpic-core", "dep:rpic-render"]

[profile.release]
# A panic is a bug, but it must never take the R session down: with
# `unwind`, savvy turns a panic into an ordinary R error
# (fase4-api.md: "pânico nunca cruza a borda").
panic = "unwind"

# faer's LU is unusably slow unoptimized (see the root Cargo.toml);
# keep `devtools::load_all()` (dev profile) usable.
[profile.dev.package.faer]
opt-level = 3
[profile.dev.package.dune-core]
opt-level = 3
