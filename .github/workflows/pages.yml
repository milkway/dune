name: pages

# Publishes the static landing page in site/ to GitHub Pages whenever
# site/ changes on main. Pages must be set to "GitHub Actions" as its
# source (Settings → Pages), and the repo must be public for Pages on
# the free plan. The job is ~30 s of ubuntu, so the push trigger stays
# even while the heavy CI is dispatch/PR-only.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
