name: publish-pypi

# Publishes the Python package to PyPI via trusted publishing (OIDC):
# no tokens — PyPI's pending publisher for this repo/workflow/
# environment authorizes the upload. Trigger it from the Actions tab
# (workflow_dispatch) or by publishing a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (off: build and check the artifacts only)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  wheels:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # manylinux x86_64
          - os: windows-latest
          # macOS bills 10x but only runs on releases/dispatch
          # (~US$1-2 per release, user-approved 2026-11-06).
          # macos-13 is retired and macos-14 is in brownout (the job
          # is cancelled the second it starts, 0 steps); the current
          # images are macos-15 (arm64) and macos-15-intel.
          - os: macos-15 # arm64
          - os: macos-15-intel # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Third-party actions pinned by SHA: this workflow holds the
      # PyPI OIDC credential, so a hijacked tag must not reach it.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: build
          args: --release -o dist
          # Linux: build in the manylinux2014 container (glibc 2.17).
          # Without this the wheel is built on the runner and tagged
          # with its glibc (0.1.0 went out as manylinux_2_39, which
          # pip refuses on anything older than Ubuntu 24.04). Ignored
          # on the other platforms.
          manylinux: "2014"
      - name: The Linux wheel is manylinux2014
        if: runner.os == 'Linux'
        run: ls python/dist && ls python/dist/*manylinux_2_17_x86_64*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl

  # The sdist builds on its own: maturin copies the path dependencies
  # (crates/dune-{core,netlist,raw,pic}) and the workspace manifest
  # they inherit from into the tarball, keeping the ../crates layout,
  # and ships python/Cargo.lock. Registry crates are fetched by the
  # consumer's cargo at install time (a Rust toolchain is required).
  sdist:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: -o dist
      # Fail before publishing if the sdist does not build away from
      # the repository.
      - name: Install the sdist outside the repository
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install python/dist/*.tar.gz
          cd /tmp && /tmp/sdist-venv/bin/python -I -c "import spice; print(spice.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          # Re-dispatching after a partial publish (e.g. adding the
          # macOS wheels to an existing version) must not fail on the
          # files already uploaded.
          skip-existing: true
