name: publish-pypi

# Publishes the Python package to PyPI via trusted publishing (OIDC):
# no tokens — PyPI's pending publisher for this repo/workflow/
# environment authorizes the upload. Trigger it from the Actions tab
# (workflow_dispatch) or by publishing a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # manylinux x86_64
          - os: windows-latest
          # macOS wheels wait for runner entitlement: on this private
          # repo GitHub cancels macos-14 instantly (10x minutes) and
          # macos-13 never leaves the queue (runner being retired).
          # Re-add arm64/x86_64 here once minutes allow; meanwhile the
          # macOS arm64 wheel builds locally (python/dist).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Third-party actions pinned by SHA: this workflow holds the
      # PyPI OIDC credential, so a hijacked tag must not reach it.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: build
          args: --release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl

  # No sdist yet: the crate builds from path dependencies on the
  # workspace, which an sdist consumer would not have (vendoring is a
  # pending Phase 4 task, shared with the CRAN build).

  publish:
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
