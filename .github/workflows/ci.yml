name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Oracle golden check
        run: cargo run -p dune-oracle -- --ci
      - name: Clippy (wasm32)
        run: cargo clippy -p dune-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build dune-wasm (wasm32)
        run: cargo build -p dune-wasm --target wasm32-unknown-unknown --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo check --workspace
