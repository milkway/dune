name: CI

on:
  push:
    branches: [main]
    # site/ has its own pages workflow; without this, a site-only push
    # starts a CI run whose concurrency group cancels the previous one
    # mid-flight, and the cancelled run paints the badge "failing".
    paths-ignore:
      - "site/**"
  pull_request:
  workflow_dispatch:

# A newer push supersedes the queued/running CI of older commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Parallel sweep and device load (bit-identical to sequential)
        run: |
          cargo clippy -p dune-core --features parallel --all-targets -- -D warnings
          cargo test -p dune-core --features parallel --test sweep
          # Every corpus deck x {2, 3, 64} load threads vs 1; release
          # because the debug build takes ~20 min over the corpus.
          cargo test -p dune-core --features parallel --release --lib --test parload
      # D-0060: the engine must build, lint and refuse BSIM decks
      # cleanly without the `bsim` feature (plain Modified BSD build).
      - name: Without the BSIM models (feature bsim off)
        run: |
          cargo clippy -p dune-core --no-default-features --features solver-faer --all-targets -- -D warnings
          cargo test -p dune-core --no-default-features --features solver-faer --lib --test no_bsim
      - name: Oracle golden check
        run: cargo run -p dune-oracle -- --ci
      # Fidelity is the golden check above; this is accuracy: every
      # transient deck at its own step against Dune's refined run,
      # held to the caps of corpus/ACCURACY (release: 40x the steps).
      - name: Accuracy ruler
        run: cargo run -p dune-oracle --release -- --accuracy
      - name: Sparse backend (solver-xingo)
        run: |
          cargo clippy -p dune-core --features solver-xingo --all-targets -- -D warnings
          cargo test -p dune-core --features solver-xingo --release
          cargo run -p dune-oracle --release --features dune-core/solver-xingo -- --ci
          cargo check -p dune-core --no-default-features --features solver-xingo --target wasm32-unknown-unknown
      - name: Clippy (wasm32)
        run: cargo clippy -p dune-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build dune-wasm (wasm32)
        run: cargo build -p dune-wasm --target wasm32-unknown-unknown --release
      - name: Check dune-pic (wasm32)
        run: cargo check -p dune-pic --target wasm32-unknown-unknown

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo check --workspace

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint the crate
        working-directory: python
        run: cargo fmt --check && cargo clippy -- -D warnings
      - name: Build and install
        working-directory: python
        run: |
          python -m pip install maturin
          maturin build --release -o dist
          python -m pip install dist/*.whl polars numpy pandas pytest
      # Test the INSTALLED wheel, from a directory that cannot shadow it.
      # Run from python/, the source package spice/ (which has no
      # compiled _spice: only `maturin develop` puts one there) wins the
      # import twice over — `python -m` puts the cwd on sys.path, and
      # pytest's default prepend import mode puts python/ there to import
      # spice/*.py (a package) for --doctest-modules — and collection
      # dies with "cannot import name '_spice' from partially initialized
      # module 'spice'". So: plain `pytest` (no cwd on sys.path) from
      # $RUNNER_TEMP, the pyproject passed with -c (rootdir = python/,
      # addopts --doctest-modules kept), tests/ by path (no __init__.py,
      # so only tests/ itself is prepended) and the doctests collected
      # from the installed package via --pyargs. Explicit arguments
      # replace `testpaths`, whose "spice" would mean the source tree.
      - name: Test
        env:
          PY: ${{ github.workspace }}/python
        run: |
          cd "$RUNNER_TEMP"
          python -I -c 'import spice; print(spice.__file__); assert "site-packages" in spice.__file__'
          pytest -q -p no:cacheprovider -c "$PY/pyproject.toml" "$PY/tests" --pyargs spice

  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUNE_ROOT: ${{ github.workspace }}
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: r/src/rust
      - name: Lint the crate
        working-directory: r/src/rust
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The package-library cache (keyed on the resolved lockfile) is
      # normally saved only when the job succeeds; the first runs never
      # did (a hung test got them cancelled), so every run restarted
      # cold. "always" saves it on failure/cancel too. P3M already
      # serves binaries (use-public-rspm), so a cold install is ~3 min
      # of downloads; system requirements (pandoc, cmake, …) still come
      # from apt on every run — uncached by design of the action.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          cache: always
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'

  # The CRAN path: the self-contained tarball (tools/r-vendor.sh +
  # R CMD build) checked away from the repository, as CRAN does — no
  # DUNE_ROOT, no network for cargo. The `r` job above builds against
  # the checkout and cannot see what the tarball is missing (a new
  # [[bench]] target's source, a corpus file a test reads).
  r-tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::jsonlite
          cache: always
      - name: Vendor
        run: |
          tools/r-vendor.sh
          # inst/AUTHORS is committed and must match the lockfile.
          git diff --exit-code r/inst/AUTHORS
      - name: Build the source tarball
        run: R CMD build r
      - uses: actions/upload-artifact@v7
        with:
          name: r-tarball
          path: spice_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  r-vendored:
    needs: r-tarball
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    steps:
      # Only for r/DESCRIPTION (the dependency list); the check runs
      # on the tarball, in a directory outside the checkout.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          cache: always
      - uses: actions/download-artifact@v8
        with:
          name: r-tarball
          path: ${{ runner.temp }}/tarball
      - name: R CMD check --as-cran on the tarball
        shell: Rscript {0}
        working-directory: ${{ runner.temp }}/tarball
        run: |
          tarball <- list.files(pattern = "^spice_.*[.]tar[.]gz$")
          stopifnot(length(tarball) == 1L)
          res <- rcmdcheck::rcmdcheck(
            tarball,
            args = c("--no-manual", "--as-cran"),
            check_dir = "check",
            error_on = "never"
          )
          print(res)
          install_log <- file.path("check", "spice.Rcheck", "00install.out")
          if (file.exists(install_log)) {
            log <- readLines(install_log, warn = FALSE)
            # The build must have taken the offline, vendored path.
            if (!any(grepl("offline build from rust/vendor.tar.xz", log, fixed = TRUE))) {
              stop("the check did not build from the vendored sources")
            }
          }
          if (length(res$errors) + length(res$warnings) > 0L) {
            if (file.exists(install_log)) writeLines(tail(log, 80))
            stop("R CMD check: errors or warnings")
          }
      - name: Test results
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/tarball/check/spice.Rcheck/tests/testthat.Rout"
          [ -f "$f" ] && tail -n 15 "$f" || [ -f "$f.fail" ] && tail -n 60 "$f.fail" || true
