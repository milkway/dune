name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Oracle golden check
        run: cargo run -p dune-oracle -- --ci
      - name: Clippy (wasm32)
        run: cargo clippy -p dune-wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build dune-wasm (wasm32)
        run: cargo build -p dune-wasm --target wasm32-unknown-unknown --release
      - name: Check dune-pic (wasm32)
        run: cargo check -p dune-pic --target wasm32-unknown-unknown

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo check --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the crate
        working-directory: python
        run: cargo fmt --check && cargo clippy -- -D warnings
      - name: Build and install
        working-directory: python
        run: |
          python -m pip install maturin
          maturin build --release -o dist
          python -m pip install dist/*.whl polars numpy pandas pytest
      - name: Test
        working-directory: python
        run: python -m pytest -q

  r:
    runs-on: ubuntu-latest
    env:
      DUNE_ROOT: ${{ github.workspace }}
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: r/src/rust
      - name: Lint the crate
        working-directory: r/src/rust
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
