[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
# Distribution name: `spice` is a release-less registration PyPI will
# not free (D-0017), so the dist is spice3 — the module stays
# `import spice` (dist and import names are independent).
name = "spice3"
# The version comes from python/Cargo.toml (single source).
dynamic = ["version"]
description = "Circuit simulation for Python on Dune, an engine derived from Berkeley SPICE3f5 and ngspice (independent project)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "André Leite", email = "leite@castlab.org" }]
maintainers = [{ name = "André Leite", email = "leite@castlab.org" }]
keywords = [
    "spice",
    "circuit-simulation",
    "spice3f5",
    "ngspice",
    "eda",
    "electronics",
    "transient-analysis",
]
# 3.10 floor: the abi3-py310 wheel covers every CPython >= 3.10;
# 3.9 is end-of-life (Oct 2025), NumPy >= 2.1 and current polars no
# longer support it, and 3.10 lets the typed layer use `X | Y` unions
# at runtime.
requires-python = ">=3.10"
dependencies = [
    # Tabular results (`Plot.df()`).
    "polars>=1.0",
    # Columns are NumPy arrays (`Plot.column()`); the native module
    # builds them through the NumPy C API, so this is not optional.
    "numpy>=1.23",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/milkway/dune"
Issues = "https://github.com/milkway/dune/issues"

[project.optional-dependencies]
# `Plot.df(pandas=True)`.
pandas = ["pandas>=2.0"]
# Arrow interchange of the polars frames (`Plot.df().to_arrow()`).
pyarrow = ["pyarrow>=14"]
test = ["pytest>=8", "pandas>=2.0"]

[tool.maturin]
module-name = "spice._spice"
python-source = "."
python-packages = ["spice"]
features = ["pyo3/extension-module"]
# py.typed and _spice.pyi ship with the package; bytecode does not.
exclude = ["spice/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "spice"]
addopts = "--doctest-modules"

[tool.mypy]
strict = true
