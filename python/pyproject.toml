[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "spice"
# The version comes from Cargo.toml (single source; 0.0.1).
dynamic = ["version"]
description = "SPICE3f5-faithful circuit simulation (the Dune engine) for Python"
license = "BSD-3-Clause"
authors = [{ name = "André Leite" }]
# 3.10 floor: the abi3-py310 wheel covers every CPython >= 3.10;
# 3.9 is end-of-life (Oct 2025), NumPy >= 2.1 and current polars no
# longer support it, and 3.10 lets the typed layer use `X | Y` unions
# at runtime.
requires-python = ">=3.10"
dependencies = [
    # Tabular results (`Plot.df()`).
    "polars>=1.0",
    # Columns are NumPy arrays (`Plot.column()`); the native module
    # builds them through the NumPy C API, so this is not optional.
    "numpy>=1.23",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]

[project.optional-dependencies]
# `Plot.df(pandas=True)`.
pandas = ["pandas>=2.0"]
# Arrow interchange of the polars frames (`Plot.df().to_arrow()`).
pyarrow = ["pyarrow>=14"]
test = ["pytest>=8", "pandas>=2.0"]

[tool.maturin]
module-name = "spice._spice"
python-source = "."
python-packages = ["spice"]
features = ["pyo3/extension-module"]
# py.typed and _spice.pyi ship with the package; bytecode does not.
exclude = ["spice/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "spice"]
addopts = "--doctest-modules"

[tool.mypy]
strict = true
