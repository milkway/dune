# cbindgen configuration for include/dune.h. Regenerate with
#   DUNE_FFI_BLESS=1 cargo test -p dune-ffi --test header
# (tests/header.rs fails when the committed header is stale).
language = "C"
cpp_compat = true
include_guard = "DUNE_H"
autogen_warning = "/* Generated by cbindgen from crates/dune-ffi; do not edit. Regenerate: DUNE_FFI_BLESS=1 cargo test -p dune-ffi --test header */"
header = """/*
 * dune.h - stable C ABI of the Dune circuit simulator (SPICE3f5-derived).
 *
 * Run a deck with dune_simulate / dune_simulate_with_includes /
 * dune_simulate_file; read the opaque DuneResult with the accessors;
 * release it with dune_result_free (the only deallocation call). Every
 * string and column pointer borrows from its DuneResult and is valid
 * until that call. All functions accept NULL pointers and out-of-range
 * indices (returning NULL / 0 / false / -1).
 */"""
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["DuneErrorKind", "DuneSeverity"]
