[package]
name = "dune-cli"
description = "The `dune` command-line simulator (batch mode, spice3 -b compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dune"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dune-netlist.workspace = true
dune-core.workspace = true
dune-raw.workspace = true
dune-pic.workspace = true
# rpic's `texlabels` math renderer (RaTeX, via `rpic-render`'s
# `math` feature only — no raster/PDF backends). Registered at the top
# of `main` so a `$...$` label in a figure (`texlabels = 1`) comes out
# typeset in `dune pic --svg`. The pin must equal dune-pic's
# `rpic-core`: the renderer hook is a static of that crate, and a
# second rpic-core in the graph would carry its own, unread, hook.
# Kept out of dune-pic/dune-core: those stay wasm-friendly and
# dependency-free (issue #7; docs/dune-pic.md "Rótulos $...$").
rpic-core = { version = "=0.19.1", optional = true }
rpic-render = { version = "=0.19.1", default-features = false, features = ["math"], optional = true }
# RaTeX carries its KaTeX fonts through `rust-embed`, which in a debug
# build does not embed anything: it reads the files at run time from
# the crate's source in `~/.cargo/registry`. A debug `dune` then
# typesets math as long as that directory is there, and silently
# falls back to literal text when it is cleaned (the one failure of
# `tests/texlabels.rs` on 2026-11-11, during a registry cleanup).
# `debug-embed` makes every profile embed them.
rust-embed = { version = "8.11", features = ["debug-embed"], optional = true }

[features]
default = ["texlabels"]
# Typeset `$...$` figure labels (rpic `texlabels`) with RaTeX.
texlabels = ["dep:rpic-core", "dep:rpic-render", "dep:rust-embed"]

[dev-dependencies]
tempfile.workspace = true
