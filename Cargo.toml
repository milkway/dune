[workspace]
resolver = "3"
members = [
    "crates/dune-netlist",
    "crates/dune-core",
    "crates/dune-raw",
    "crates/dune-cli",
    "crates/dune-oracle",
    "crates/dune-wasm",
    "crates/dune-ffi",
    "crates/dune-pic",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
# MSRV: 1.88 — dune-raw uses let-chains (stable 1.88); was declared
# 1.85 but never true since then (the msrv CI job caught up 2026-11-06).
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/milkway/dune"
homepage = "https://milkway.github.io/dune/"

keywords = ["spice", "circuit", "simulation", "eda", "electronics"]
categories = ["science", "simulation"]

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
num-complex = "0.4"
tempfile = "3"
# `erfc` for the RC lossy line (fdlibm port, pure Rust, wasm-safe).
libm = "0.2"

# The Xingó project's sparse LU (D-0005), from crates.io; only
# `dune-core`'s optional `solver-xingo` feature uses it. No default
# features: its own `faer` feature is the KKT/LDL side, unused here.
xingo-sparse = { version = "0.3", default-features = false }

dune-netlist = { path = "crates/dune-netlist", version = "0.1.1" }
dune-core = { path = "crates/dune-core", version = "0.1.1" }
dune-raw = { path = "crates/dune-raw", version = "0.1.1" }
dune-pic = { path = "crates/dune-pic", version = "0.1.1" }

# faer's LU is unusably slow unoptimized, and optimizing the faer
# package alone does not help: its generic entry points monomorphize
# into dune-core, so the hot code is compiled with dune-core's own
# opt-level. Optimizing both takes the debug oracle run (CI's
# `cargo run -p dune-oracle -- --ci`) from 12:51 to 5:41 on Apple
# Silicon (measured 2026-11-06, 64 circuits). The remaining gap to
# the ~10 s release run is the dev profile's own checking
# (overflow-checks, debug_assertions), which is the point of running
# the oracle in debug, so it stays; optimizing dune-raw/netlist/
# oracle too was measured to change nothing (5:27) and is not done.
[profile.dev.package.faer]
opt-level = 3
[profile.dev.package.dune-core]
opt-level = 3
